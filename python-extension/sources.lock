# Every source the python-extension add-on builds from: name, URL, sha256 of the download, and the
# file name it is kept under in build/dl when the URL's own name says too little.
# The Python packages are their PyPI sdists, but LIEF: its PyPI sdist only downloads the source at
# install time, so it is the archive of its GitHub tag. The C libraries behind Pillow are the
# versions Pillow 12.3.0's own wheels carry (.github/dependencies.json at its tag); their projects
# sign their releases rather than publish checksums, and GitHub's tag archives have none: for those,
# the hash of the download reviewed when it was added. libc++ is LLVM 19.1.7's, the release of the
# host's clang-19. setuptools and pybind11 run Pillow's setup.py (pybind11 for its parallel compile).
# zlib and xz: the python step's versions (python/sources.lock), built again position-independent
# for the modules that use them (the interpreter's copies are neither exported nor PIC). The
# libraries behind lxml are those of lxml 6.1.3's own static build, with the sha256 it pins
# (buildlibxml.py's ARCHIVE_HASHES; libxml2 and libxslt: its Makefile's MANYLINUX_* versions).
# pycparser is its pure-Python wheel. libffi: the release cffi's own wheels are built with is
# older; this one has the wasm32 port the add-on's backend joins (packages/cffi). OpenSSL: the
# version cryptography 50.0.2's own wheels carry (OpenSSL_version() of the wheel's module).
# rpds-py: its sdist (the same files as its GitHub tag 2026.9.1, and PKG-INFO). mcp: its wheel and
# those of what it needs, resolved from PyPI for CPython 3.13 on Linux (packages/mcp).

