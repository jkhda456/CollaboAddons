# The python-extension add-on: pip finds the wheels it carries in /usr/share/python-wheels — the
# versions of cffi (and pycparser, which it needs) and of unicorn built for this machine, whose
# sdists from PyPI cannot be built here. A build's isolated environment (zstandard's `cffi~=1.17`),
# a virtual environment, `pip install cffi==2.0.0` and a package's pin (pwntools' unicorn
# `>=2.0.1,!=2.1.3,!=2.1.4`: 2.0.1.post1) take them; the rest still comes from the index.
# Unicorn from wheels only: of the versions a requirement allows, pip would take a higher one's
# sdist from the index over the wheels here (PyPI's 2.1.2 for pwntools), and its build fails — CMake
# knows no wasm32 host, and Unicorn would have no TCG interpreter to run on (packages/unicorn).
# `pip install --no-binary unicorn ...` (or PIP_ONLY_BINARY=:none:) lifts it for one command.
[global]
find-links = /usr/share/python-wheels
only-binary = unicorn
