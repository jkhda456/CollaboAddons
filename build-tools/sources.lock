# Every source the build-tools add-on builds from: name, URL, sha256 of the download, and the file
# name it is kept under in build/dl when the URL's own name says too little.
# GNU make and pkgconf: their release tarballs (GNU signs its releases rather than publish
# checksums: the hash of the download reviewed when it was added). ninja: the archive of its
# GitHub tag. libc++ is LLVM 19.1.7's, the release of the host's clang-19 (ninja is C++), as the
# nmap, node and jdk add-ons build it. googletest: what ninja's CMakeLists.txt pins for ninja_test
# (built for the tests only, TEST=1). CMake: its release tarball, with the sha256 Kitware publishes
# (cmake-4.4.5-SHA-256.txt).
