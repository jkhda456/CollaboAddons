# Every source the imagemagick add-on builds from but ImageMagick itself (the clone ../org/ImageMagick
# at IM_REV, build.sh): name, URL, sha256 of the download, and the file name it is kept under in
# build/dl when the URL's own name says too little. A file another add-on has downloaded already
# (wpe, python-extension, typst) is taken from its build/dl, hard-linked, and checked the same.
#
# The delegate libraries are the versions the other add-ons build (wpe: libpng, libjpeg-turbo,
# libwebp, FreeType, libxml2; python-extension: zlib, xz, libtiff, Little CMS, OpenJPEG), with the
# sha256 those add-ons pin. Their projects sign releases rather than publish checksums: for those,
# the hash of the download reviewed when it was first added.

